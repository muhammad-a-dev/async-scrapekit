[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scrapekit"
version = "0.1.0"
description = "A polite, production-minded async web scraping toolkit built on httpx."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Ali", email = "muhammad-a-dev@users.noreply.github.com" },
]
keywords = [
    "async",
    "scraping",
    "httpx",
    "robots.txt",
    "rate-limit",
    "web-scraping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
cli = ["rich>=13.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "rich>=13.0.0",
]

[project.scripts]
scrapekit = "scrapekit.cli:main"

[project.urls]
Homepage = "https://github.com/muhammad-a-dev/async-scrapekit"
Repository = "https://github.com/muhammad-a-dev/async-scrapekit"
Issues = "https://github.com/muhammad-a-dev/async-scrapekit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrapekit = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
